<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Crime Intelligence Platform — Karnataka State Police, State Crime Records Bureau"
    />
    <meta name="theme-color" content="#0b4229" />
    <title>KSP Crime Intelligence Platform</title>
    <script>
      // Stamp the theme before first paint so a dark-mode reload doesn't flash white.
      (function () {
        try {
          var stored = localStorage.getItem("ksp-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage unavailable — the CSS media query still covers us */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
