<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="KSP Crime Intelligence Platform">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f4c33"/>
      <stop offset="55%" stop-color="#0b4229"/>
      <stop offset="100%" stop-color="#06291a"/>
    </linearGradient>
    <linearGradient id="b-gold" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#f4e3a1"/>
      <stop offset="34%" stop-color="#d9b43c"/>
      <stop offset="66%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    <linearGradient id="b-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c9a227" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#b-bg)"/>

  <!-- Hotspot bloom, echoing the heatmap the product is built around -->
  <circle cx="980" cy="150" r="210" fill="url(#b-glow)"/>
  <circle cx="1075" cy="96" r="120" fill="url(#b-glow)"/>

  <!-- Faint command-tree lattice: state → city → division → station -->
  <g stroke="#c9a227" stroke-opacity="0.16" stroke-width="1.4" fill="none">
    <path d="M980 78 V112 M980 112 H872 M980 112 H1088 M872 112 V146 M1088 112 V146
             M872 146 H812 M872 146 H932 M1088 146 H1028 M1088 146 H1148
             M812 146 V180 M932 146 V180 M1028 146 V180 M1148 146 V180"/>
  </g>
  <g fill="#c9a227" fill-opacity="0.5">
    <circle cx="980" cy="78" r="4.5"/>
    <circle cx="872" cy="146" r="3.4"/><circle cx="1088" cy="146" r="3.4"/>
    <circle cx="812" cy="180" r="2.6"/><circle cx="932" cy="180" r="2.6"/>
    <circle cx="1028" cy="180" r="2.6"/><circle cx="1148" cy="180" r="2.6"/>
  </g>

  <!-- Emblem -->
  <g transform="translate(76 82) scale(1.36)">
    <path d="M50 4 L87 16.5 V45 C87 69 71.5 86.5 50 96.5 C28.5 86.5 13 69 13 45 V16.5 Z" fill="url(#b-gold)"/>
    <path d="M50 8.4 L83 19.6 V45 C83 66.6 69 82.4 50 91.7 C31 82.4 17 66.6 17 45 V19.6 Z" fill="#0b4229"/>
    <path d="M50 12.6 L79 22.4 V45 C79 64.2 66.6 78.6 50 87.2 C33.4 78.6 21 64.2 21 45 V22.4 Z" fill="none" stroke="#c9a227" stroke-width="0.9" opacity="0.55"/>
    <path d="M28 62 C33 74 41 81 50 84 C59 81 67 74 72 62" fill="none" stroke="#c9a227" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M50 31 L54.8 44.4 L69 44.8 L57.8 53.5 L61.8 67.2 L50 59.2 L38.2 67.2 L42.2 53.5 L31 44.8 L45.2 44.4 Z" fill="url(#b-gold)"/>
    <path d="M50 31 L54.8 44.4 L45.2 44.4 Z" fill="#fdf1c4" opacity="0.55"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="126" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Crime Intelligence Platform
  </text>
  <rect x="256" y="146" width="150" height="3" rx="1.5" fill="url(#b-rule)"/>
  <text x="256" y="184" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="500" fill="#c9a227">
    Karnataka State Police · State Crime Records Bureau
  </text>
  <text x="256" y="222" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="400" fill="#ffffff" fill-opacity="0.62">
    Spatial, relational and predictive intelligence over 5,200 FIRs — with every action audited.
  </text>

  <!-- Datathon tag -->
  <g transform="translate(256 244)">
    <rect width="232" height="30" rx="15" fill="#c9a227" fill-opacity="0.14" stroke="#c9a227" stroke-opacity="0.42"/>
    <text x="116" y="20" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="650" fill="#e8cf72" letter-spacing="1.1">
      DATATHON 2026 · CHALLENGE 02
    </text>
  </g>

  <rect y="296" width="1200" height="4" fill="url(#b-gold)"/>
</svg>
